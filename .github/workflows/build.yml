name: Build Dopamine DLL

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Build Solution
      run: msbuild Dopamine.sln /p:Configuration=Release /p:Platform=x86

    - name: Upload DLL
      uses: actions/upload-artifact@v4
      with:
        name: Dopamine-Release
        path: '**/Release/*.dll'
